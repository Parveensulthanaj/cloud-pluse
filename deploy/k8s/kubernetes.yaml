apiVersion: v1
kind: Namespace
metadata:
  name: cloudpulse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  namespace: cloudpulse
data:
  CLOUDPULSE_ENV: "production"
  CLOUDPULSE_PORT: "8000"
  LATENCY_Z_SCORE_THRESHOLD: "2.5"
  ERROR_RATE_PERCENT_THRESHOLD: "8.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-controller
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/component: telemetry-mesh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudpulse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudpulse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: cloudpulse
          image: cloudpulse/platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cloudpulse-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-service
  namespace: cloudpulse
  labels:
    app: cloudpulse
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: cloudpulse
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudpulse-hpa
  namespace: cloudpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse-controller
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
